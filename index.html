<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#231b2e">
<title>My Hangout Room</title>
<!--
  MY HANGOUT ROOM — see APP_VERSION in section 1
  One self-contained file: no internet, no server, no paid tools.
  Everything (art, sounds, music) is drawn or generated by the code below.
  Saves to this browser/device (localStorage). Use Settings > Backup to move saves.

  Map of the code:
    1. CSS (look & layout)
    2. HTML screens: profiles, room, fidget shelf, closet, + modal/toast
    3. JS: save data -> art helpers -> mascot + closet items -> room + decor
           -> fidgets (pop-it, squishy, spinner) -> sound/music -> screens/wiring
-->
<style>
:root{--bg:#231b2e;--panel:#2f2540;--panel2:#3b2f52;--ink:#fff;--muted:#cbbbe6;--pink:#ff8cc6;--purple:#a97cff;--mint:#8ff0d0;--gold:#ffd166;--line:#4a3d63}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Nunito","Segoe UI",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.hidden{display:none!important}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--panel);border-bottom:3px solid var(--line);flex:0 0 auto}
.topbar .title{font-weight:900;font-size:20px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{background:var(--purple);padding:10px 16px;border-radius:16px;font-weight:800;box-shadow:0 4px 0 #6a45c0;font-size:16px;color:#fff}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #6a45c0}
.btn.pink{background:var(--pink);box-shadow:0 4px 0 #c8578f;color:#3a1830}
.btn.pink:active{box-shadow:0 1px 0 #c8578f}
.btn.ghost{background:var(--panel2);box-shadow:0 4px 0 #1a1424}
.btn.ghost:active{box-shadow:0 1px 0 #1a1424}
.btn.small{padding:7px 11px;font-size:14px;border-radius:12px}
.coins{background:#3a2c18;color:var(--gold);padding:6px 12px;border-radius:999px;font-weight:900;border:2px solid #6b5220;white-space:nowrap}

/* profiles */
#scr-profiles{overflow-y:auto;background:radial-gradient(circle at 50% 25%,#4b3a66,#231b2e 70%)}
.prof-wrap{margin:auto;width:min(760px,94vw);text-align:center;padding:24px 0}
h1{margin:4px 0;font-size:clamp(26px,5vw,42px);text-shadow:0 3px 0 #000}
.sub{color:var(--muted);font-weight:700}
.prof-hero{height:150px;margin:6px auto}
.prof-hero svg{height:100%}
.prof-list{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:18px 0}
.pcard{background:var(--panel);border:3px solid var(--line);border-radius:22px;width:168px;padding:10px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.pcard:active{transform:translateY(3px)}
.pcard .pm{height:150px}
.pcard .pm svg{height:100%;width:100%}
.pn{font-weight:900;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc{color:var(--gold);font-weight:800}
.pa{display:flex;gap:6px;justify-content:center;margin-top:8px}
.empty{grid-column:1/-1;color:var(--muted);padding:16px;text-align:center;font-weight:700}
.furpick{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.furpick button{width:50px;height:50px;border-radius:50%;border:4px solid #0003}
.furpick button.on{border-color:var(--pink);transform:scale(1.1)}

/* room */
.stage{flex:1;min-height:0;display:flex;background:#1a1422}
#roomSvg{width:100%;height:100%;display:block;touch-action:none}
.hot{cursor:pointer}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.mascot{animation:breathe 3.2s ease-in-out infinite;transform-origin:500px 604px;cursor:pointer}
@keyframes breathe{50%{transform:scale(1.02,.985)}}
.mascot.hop{animation:hop .6s ease}
@keyframes hop{0%{transform:none}25%{transform:scale(1.08,.9)}55%{transform:translateY(-40px) scale(.95,1.06)}80%{transform:scale(1.05,.95)}100%{transform:none}}
.deco{pointer-events:none}
.decorating .deco{pointer-events:all;cursor:grab}
.decorating .hot,.decorating .mascot{pointer-events:none}
.decorating .deco.dragging{filter:drop-shadow(0 10px 6px rgba(0,0,0,.45))}
.deco-panel{flex:0 0 40%;background:var(--panel);border-top:3px solid var(--line);display:flex;flex-direction:column;min-height:0;transition:background .2s}
.deco-panel.drop{background:#5a2f4f}
.deco-head{display:flex;align-items:center;gap:6px;padding-right:10px}
.deco-head .tabs{flex:1}
.hint{font-size:13px;color:var(--muted);padding:0 12px;font-weight:700}

/* shared tabs & tiles */
.tabs{display:flex;gap:6px;padding:8px;overflow-x:auto;flex:0 0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:var(--panel2);padding:8px 13px;border-radius:999px;font-weight:800;white-space:nowrap;font-size:14px;flex:0 0 auto}
.tab.on{background:var(--pink);color:#3a1830}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;padding:10px;overflow-y:auto;align-content:start}
.tile{background:var(--panel2);border-radius:18px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid transparent;position:relative;box-shadow:0 4px 0 #1a1424}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #1a1424}
.tile.on{border-color:var(--pink);background:#4b3a66}
.tile .tv{width:100%;aspect-ratio:1;background:#ffffff12;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile .tv svg{width:94%;height:94%}
.tile .tn{font-size:13px;font-weight:800;text-align:center;line-height:1.1}
.tile .tp{position:absolute;top:6px;right:6px;background:#3a2c18;color:var(--gold);font-size:12px;font-weight:900;padding:2px 7px;border-radius:999px;border:1px solid #6b5220}
.tile .tp.cnt{background:var(--pink);color:#3a1830;border-color:#c8578f}
.tile.locked .tv{filter:saturate(.55) brightness(.8)}

/* closet */
.closet-body{flex:1;min-height:0;display:flex}
.closet-preview{flex:0 0 38%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle at 50% 40%,#4b3a66,#231b2e 70%);padding:10px;min-height:0}
#closetMascot{width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#closetMascot svg{height:100%;max-width:100%;transform-origin:50% 95%}
#closetMascot.hop svg{animation:hop2 .5s ease}
@keyframes hop2{30%{transform:scale(1.07,.92)}60%{transform:translateY(-14px) scale(.96,1.05)}}
.closet-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.closet-shop{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
@media (orientation:portrait){.closet-body{flex-direction:column}.closet-preview{flex:0 0 42%}}

/* fidget */
.fid-stage{flex:1;min-height:0;position:relative;background:radial-gradient(circle at 50% 40%,#3b2f52,#1d1626 75%)}
.fid{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
.fid.on{display:flex}
.fid canvas{width:100%;height:100%;touch-action:none;display:block}
.popboard{width:min(88vw,64vh);aspect-ratio:1;border-radius:22%;padding:6%;display:grid;grid-template-columns:repeat(6,1fr);gap:3%;touch-action:none;box-shadow:0 10px 0 rgba(0,0,0,.3),inset 0 0 0 7px rgba(255,255,255,.25)}
.popboard.flip{animation:flip .65s ease-in-out}
@keyframes flip{0%{transform:perspective(900px) rotateY(0)}50%{transform:perspective(900px) rotateY(90deg) scale(.9)}100%{transform:perspective(900px) rotateY(0)}}
.bub{border-radius:50%;aspect-ratio:1;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2),inset 0 6px 8px rgba(255,255,255,.65),0 3px 0 rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s,filter .08s}
.bub.down{transform:scale(.86);box-shadow:inset 0 7px 10px rgba(0,0,0,.45),inset 0 -2px 0 rgba(255,255,255,.35),0 0 0 rgba(0,0,0,0);filter:brightness(.82)}
.rpm{position:absolute;top:10px;left:0;right:0;text-align:center;font-weight:900;font-size:20px;color:var(--mint);pointer-events:none;text-shadow:0 2px 0 #000}
.fid-tip{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:var(--muted);font-weight:800;font-size:14px;pointer-events:none}
.skins{display:flex;gap:8px;padding:8px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom));overflow-x:auto;flex:0 0 auto;background:var(--panel);border-top:3px solid var(--line)}

/* modal, toast, floaties */
.modal{position:fixed;inset:0;background:rgba(10,6,16,.65);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-card{background:var(--panel);border:3px solid var(--line);border-radius:24px;padding:18px;width:min(460px,100%);max-height:90vh;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.3)}
#modalTitle{font-size:22px;font-weight:900;margin-bottom:8px}
#modalBody{color:var(--muted);margin-bottom:14px;font-weight:700}
#modalBtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.setlist{display:flex;flex-direction:column;gap:12px}
.about{margin:16px 0 0;text-align:center;font-size:14px;opacity:.8}
.inp{width:100%;font:inherit;font-size:18px;padding:10px 12px;border-radius:14px;border:3px solid var(--line);background:#1d1626;color:#fff;user-select:text;-webkit-user-select:text}
textarea.inp{height:110px;font-size:11px;font-family:monospace;resize:none}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,180%);background:#fff;color:#2b2235;padding:12px 18px;border-radius:999px;font-weight:900;z-index:60;transition:transform .3s;max-width:92vw;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.25);pointer-events:none}
#toast.on{transform:translate(-50%,0)}
.float{position:fixed;z-index:70;pointer-events:none;font-weight:900;color:var(--gold);font-size:22px;text-shadow:0 2px 0 #000;animation:floatUp 1.1s ease-out forwards;white-space:nowrap}
@keyframes floatUp{from{transform:translate(-50%,-10px);opacity:1}to{transform:translate(-50%,-80px);opacity:0}}
</style>
</head>
<body>

<!-- shared SVG art pieces (patterns, fuzzy filter) — filled in by JS -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="gdefs"></defs></svg>

<!-- PROFILES -->
<div id="scr-profiles" class="screen">
  <div class="prof-wrap">
    <h1>✨ My Hangout Room ✨</h1>
    <div class="sub">Who's hanging out today?</div>
    <div class="prof-hero" id="profHero"></div>
    <div class="prof-list" id="profList"></div>
    <button class="btn pink" id="newProfBtn">+ Make a New Room</button>
  </div>
</div>

<!-- ROOM -->
<div id="scr-room" class="screen">
  <div class="topbar">
    <div class="title" id="roomTitle">My Room</div>
    <div class="coins coinsDisp"></div>
    <button class="btn small ghost" id="decoBtn">🛋️ Decorate</button>
    <button class="btn small ghost" id="setBtn">⚙️</button>
  </div>
  <div class="stage"><svg id="roomSvg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div id="decoPanel" class="deco-panel hidden">
    <div class="deco-head">
      <div class="tabs" id="decoTabs">
        <button class="tab on" data-dt="mine">📦 My Stuff</button>
        <button class="tab" data-dt="shop">🛍️ Shop</button>
        <button class="tab" data-dt="wall">🖼️ Walls</button>
        <button class="tab" data-dt="floor">🟫 Floors</button>
      </div>
      <button class="btn small pink" id="decoDone">✔ Done</button>
    </div>
    <div class="hint">Drag things in your room to move them. Drop them down here to put them away!</div>
    <div class="grid" id="decoGrid"></div>
  </div>
</div>

<!-- FIDGET SHELF -->
<div id="scr-fidget" class="screen">
  <div class="topbar">
    <button class="btn small ghost" data-back>⬅ Room</button>
    <div class="title">🫧 Fidget Shelf</div>
    <div class="coins coinsDisp"></div>
  </div>
  <div class="tabs" id="fidTabs" style="background:var(--panel);justify-content:center">
    <button class="tab on" data-tab="popit">🫧 Pop-it</button>
    <button class="tab" data-tab="squish">🍡 Squishy</button>
    <button class="tab" data-tab="spin">🌀 Spinner</button>
  </div>
  <div class="fid-stage">
    <div id="fid-popit" class="fid on"><div id="popBoard" class="popboard"></div><div class="fid-tip">Pop them all to flip it over! (swipe works too)</div></div>
    <div id="fid-squish" class="fid"><canvas id="squishCv"></canvas><div class="fid-tip">Press and hold… then watch it slowly rise</div></div>
    <div id="fid-spin" class="fid"><canvas id="spinCv"></canvas><div id="rpm" class="rpm"></div><div class="fid-tip">Flick it around to spin!</div></div>
  </div>
  <div class="skins" id="skinRow"></div>
</div>

<!-- CLOSET -->
<div id="scr-closet" class="screen">
  <div class="topbar">
    <button class="btn small ghost" data-back>⬅ Room</button>
    <div class="title">👗 Closet</div>
    <div class="coins coinsDisp"></div>
  </div>
  <div class="closet-body">
    <div class="closet-preview">
      <div id="closetMascot"></div>
      <div class="closet-row">
        <button class="btn small ghost" id="mascotNameBtn">Fuzzy ✏️</button>
        <button class="btn small ghost" id="randomBtn">🎲 Surprise me</button>
      </div>
    </div>
    <div class="closet-shop">
      <div class="tabs" id="closetTabs"></div>
      <div class="grid" id="closetGrid"></div>
    </div>
  </div>
</div>

<div id="modal" class="modal hidden"><div class="modal-card"><div id="modalTitle"></div><div id="modalBody"></div><div id="modalBtns"></div></div></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
   1. HELPERS + SAVE DATA
   ========================================================= */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const TAU=Math.PI*2;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const APP_VERSION='1.2';      // shown in Settings; bump with every PR (matches versionName in android/app/build.gradle.kts)
const SAVE_KEY='hangoutRoom.v1'; // never change: her saves live under this key
const DB_VERSION=1;           // version of the save-data shape; bump only when the shape changes

function freshDB(){return {version:DB_VERSION,profiles:[],activeId:null,settings:{sound:true,music:false}};}

// Save-data upgrades. When the shape changes, bump DB_VERSION and add a step here
// that turns a save of the previous version into the new one, e.g.
//   2: d=>{ d.profiles.forEach(p=>{ p.drawings=p.drawings||[]; }); },
// Steps run in order, so a very old save or backup is upgraded one version at a time.
// Never rename or remove saved fields or item ids.
const MIGRATIONS={};

// Used for the saved data on load AND for restored backups, so both get the same fixes.
// (Per-profile defaults are filled in later by normalize() in section 6.)
function fixDB(d){
  if(!d||typeof d!=='object'||Array.isArray(d)) d=freshDB();
  let v=Number(d.version)||1;
  while(v<DB_VERSION){v++;if(MIGRATIONS[v])MIGRATIONS[v](d);}
  d.version=v; // a backup from a newer app keeps its higher number and extra fields
  d.settings=Object.assign({sound:true,music:false},d.settings||{});
  d.profiles=Array.isArray(d.profiles)?d.profiles.filter(p=>p&&typeof p==='object'):[];
  if(!d.profiles.some(p=>p.id===d.activeId)) d.activeId=null;
  return d;
}

let DB;
try{DB=JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){DB=null;}
DB=fixDB(DB);

function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(DB));}catch(e){toast('Hmm, could not save!');}}
function saveSoon(){clearTimeout(saveSoon.t);saveSoon.t=setTimeout(save,600);}
const P=()=>DB.profiles.find(p=>p.id===DB.activeId);

/* =========================================================
   2. ART HELPERS
   ========================================================= */
function st(c,w){return `stroke="${c||'#4a3a5c'}" stroke-width="${w||3}" stroke-linejoin="round" stroke-linecap="round"`;}
function starPath(cx,cy,r,ri){ri=ri||r*0.45;let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?ri:r;d+=(i?'L':'M')+(cx+Math.cos(a)*rr).toFixed(1)+' '+(cy+Math.sin(a)*rr).toFixed(1);}return d+'Z';}
function heartPath(cx,cy,s){return `M${cx} ${cy+s*0.9} C${cx-s*1.6} ${cy-s*0.1} ${cx-s*0.9} ${cy-s*1.3} ${cx} ${cy-s*0.45} C${cx+s*0.9} ${cy-s*1.3} ${cx+s*1.6} ${cy-s*0.1} ${cx} ${cy+s*0.9}Z`;}

function buildDefs(){
  const rainbow=['#ff6b8a','#ffa94d','#ffe066','#69db7c','#4dabf7','#b197fc'];
  $('#gdefs').innerHTML=`
  <filter id="fuzz" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd0ff"/><stop offset="1" stop-color="#e0f6ff"/></linearGradient>
  <pattern id="stripeBP" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#1f1a26"/><rect y="5" width="10" height="5" fill="#9b5de5"/></pattern>
  <pattern id="stripeBW" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#1f1a26"/><rect y="5" width="10" height="5" fill="#f4f0f8"/></pattern>
  <pattern id="rainbowS" width="10" height="30" patternUnits="userSpaceOnUse">${rainbow.map((c,i)=>`<rect y="${i*5}" width="10" height="5" fill="${c}"/>`).join('')}</pattern>
  <pattern id="plaid" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#c2253f"/><rect y="5" width="16" height="5" fill="#1f1a26" opacity=".55"/><rect x="5" width="5" height="16" fill="#1f1a26" opacity=".55"/><rect y="13" width="16" height="1" fill="#ffd166" opacity=".6"/><rect x="13" width="1" height="16" fill="#ffd166" opacity=".6"/></pattern>
  <pattern id="plaidP" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#6d3fd6"/><rect y="5" width="16" height="5" fill="#1f1a26" opacity=".55"/><rect x="5" width="5" height="16" fill="#1f1a26" opacity=".55"/><rect y="13" width="16" height="1" fill="#ff8cc6" opacity=".8"/><rect x="13" width="1" height="16" fill="#ff8cc6" opacity=".8"/></pattern>
  <pattern id="pDots" width="60" height="60" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="4" fill="#fff" opacity=".45"/><circle cx="45" cy="45" r="4" fill="#fff" opacity=".45"/></pattern>
  <pattern id="pStars" width="110" height="110" patternUnits="userSpaceOnUse"><path d="${starPath(22,26,7)}" fill="#fff" opacity=".85"/><path d="${starPath(76,72,10)}" fill="#ffd166" opacity=".9"/><circle cx="62" cy="18" r="2.2" fill="#fff"/><circle cx="96" cy="36" r="1.7" fill="#fff"/><circle cx="30" cy="88" r="2" fill="#fff" opacity=".7"/></pattern>
  <pattern id="pHearts" width="70" height="70" patternUnits="userSpaceOnUse"><path d="${heartPath(18,18,8)}" fill="#fff" opacity=".5"/><path d="${heartPath(53,53,6)}" fill="#ff8cc6" opacity=".6"/></pattern>
  <pattern id="pCheck" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="30" height="30" fill="#ffffff16"/><rect x="30" y="30" width="30" height="30" fill="#ffffff16"/></pattern>
  <pattern id="pPlanks" width="240" height="46" patternUnits="userSpaceOnUse"><rect y="43" width="240" height="3" fill="#00000026"/><rect x="160" width="3" height="46" fill="#0000001c"/><path d="M20 20 Q60 14 100 22" stroke="#00000012" stroke-width="3" fill="none"/></pattern>
  <pattern id="pFluff" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="4" fill="#fff" opacity=".22"/><circle cx="19" cy="19" r="4" fill="#fff" opacity=".22"/></pattern>
  <pattern id="pTiles" width="70" height="70" patternUnits="userSpaceOnUse"><rect width="35" height="35" fill="#26212e"/><rect x="35" y="35" width="35" height="35" fill="#26212e"/></pattern>
  <pattern id="pTurf" width="100" height="10" patternUnits="userSpaceOnUse"><rect width="50" height="10" fill="#ffffff1c"/></pattern>`;
}

/* =========================================================
   3. MASCOT (the fuzzy emo bunny) + CLOSET ITEMS
   Coordinates are in a 200 x 270 box.
   ========================================================= */
const FUR={
  white:{name:'Marshmallow',c:'#f8f4fb',e:'#ffb3cf',price:0},
  pink:{name:'Bubblegum',c:'#ffc9df',e:'#ff8fb8',price:0},

function face(dark){
  const ec=dark?'#0e0a12':'#2a1f33', lc=dark?'#fff':ec;
  const eye=x=>`<ellipse cx="${x}" cy="100" rx="8.5" ry="10.5" fill="${ec}"${dark?' stroke="#ffffff66" stroke-width="2"':''}/><circle cx="${x+3}" cy="95.5" r="3.4" fill="#fff"/><circle cx="${x-2.5}" cy="104.5" r="1.6" fill="#fff"/>`;
  return eye(80)+eye(120)+`<path d="M71.5 94 l-6 -4 M128.5 94 l6 -4" stroke="${lc}" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="65" cy="115" rx="9" ry="5" fill="#ff8fb8" opacity=".55"/><ellipse cx="135" cy="115" rx="9" ry="5" fill="#ff8fb8" opacity=".55"/><path d="M96.5 108 h7 l-3.5 4z" fill="#ff8fb8"/><path d="M93 115.5 q3.5 4 7 0 q3.5 4 7 0" fill="none" stroke="${lc}" stroke-width="2.2" stroke-linecap="round"/>`;
}

function mascotSVG(L,vb,attrs){
  const f=FUR[L.fur]||FUR.white, dark=L.fur==='black', line=dark?'#15101b':'#4a3a5c';
  const top=itemOf('top',L.top), bot=itemOf('bottom',L.bottom);
  let s=`<svg viewBox="${vb||'0 0 200 270'}" xmlns="http://www.w3.org/2000/svg" ${attrs||''}>`;
  s+=`<g ${st(line)} fill="${f.c}"><ellipse cx="74" cy="40" rx="17" ry="40" transform="rotate(-14 74 70)"/><ellipse cx="126" cy="40" rx="17" ry="40" transform="rotate(14 126 70)"/></g>`;
  s+=`<g fill="${f.e}"><ellipse cx="74" cy="44" rx="8" ry="27" transform="rotate(-14 74 70)"/><ellipse cx="126" cy="44" rx="8" ry="27" transform="rotate(14 126 70)"/></g>`;
  s+=`<g ${st(line)} fill="${f.c}"><rect x="70" y="186" width="25" height="56" rx="12"/><rect x="105" y="186" width="25" height="56" rx="12"/></g>`;
  s+=`<rect x="60" y="126" width="80" height="84" rx="32" fill="${f.c}" ${st(line)}/><ellipse cx="100" cy="178" rx="24" ry="22" fill="#fff" opacity=".3"/>`;
  if(bot.under) s+=bot.d(f,line);
  s+=itemOf('legs',L.legs).d(f,line);
  s+=itemOf('shoes',L.shoes).d(f,line);
  if(!bot.under) s+=bot.d(f,line);
  if(top.t) s+=top.t(f);
  s+=`<g ${st(line)} fill="${f.c}"><rect x="40" y="130" width="24" height="60" rx="12" transform="${LA}"/><rect x="136" y="130" width="24" height="60" rx="12" transform="${RA}"/></g>`;
  if(top.s) s+=top.s(f);
  s+=itemOf('arms',L.arms).d(f,line);
  s+=`<ellipse cx="100" cy="92" rx="58" ry="50" fill="${f.c}" ${st(line)}/>`;
  s+=face(dark);
  s+=itemOf('hair',L.hair).d(f,line);
  s+=itemOf('acc',L.acc).d(f,line);
  return s+'</svg>';
}

let AC=null,master=null,musicBus=null,noiseBuf=null;
function ac(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{AC=new C();}catch(e){return null;}
    master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);
    musicBus=AC.createGain();musicBus.gain.value=0.6;musicBus.connect(AC.destination);}
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function tone(f,dur,type,vol,slide,delay,bus){
  if(!bus&&!DB.settings.sound) return; const a=ac(); if(!a) return;
  const t=a.currentTime+(delay||0), o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(bus||master); o.start(t); o.stop(t+dur+0.05);
}
function noise(dur,vol,f1,f2){
  if(!DB.settings.sound) return; const a=ac(); if(!a) return;
  if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate,a.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const t=a.currentTime, src=a.createBufferSource(); src.buffer=noiseBuf;
  const fl=a.createBiquadFilter(); fl.type='lowpass'; fl.frequency.setValueAtTime(f1,t); fl.frequency.exponentialRampToValueAtTime(f2,t+dur); fl.Q.value=4;
  const g=a.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(fl); fl.connect(g); g.connect(master); src.start(t); src.stop(t+dur+0.05);
}

let musicTimer=null,mStep=0;
const mf=n=>440*Math.pow(2,(n-69)/12);
const CHORDS=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]], MEL=[69,72,74,76,79,81];
function startMusic(){
  if(musicTimer||!DB.settings.music) return; if(!ac()) return;
  musicTimer=setInterval(()=>{
    if(!AC||AC.state!=='running') return;
    const bar=Math.floor(mStep/8)%4;
    if(mStep%8===0) CHORDS[bar].forEach(n=>tone(mf(n),2.3,'triangle',0.035,null,0,musicBus));
    if(mStep%2===0) tone(mf(CHORDS[bar][0]-12),0.5,'sine',0.06,null,0,musicBus);
    if(Math.random()<0.55) tone(mf(MEL[Math.floor(Math.random()*MEL.length)]),0.4,'sine',0.045,null,0,musicBus);
    mStep++;
  },300);
}

function hum(speed){
  if(!AC||!DB.settings.sound){if(humG&&AC)humG.gain.setTargetAtTime(0,AC.currentTime,0.05);return;}
  if(!humO){humO=AC.createOscillator();humO.type='triangle';humG=AC.createGain();humG.gain.value=0;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;humO.connect(lp);lp.connect(humG);humG.connect(master);humO.start();}
  const t=AC.currentTime; humO.frequency.setTargetAtTime(70+speed*7,t,0.05); humG.gain.setTargetAtTime(Math.min(0.08,speed*0.0018),t,0.05);
}
function vibrate(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800);}
function floatText(txt,x,y){const d=document.createElement('div');d.className='float';d.textContent=txt;d.style.left=(x==null?lastX:x)+'px';d.style.top=(y==null?lastY:y)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1200);}
function modal(title,body,buttons){

function updateCoins(){const p=P();if(!p)return;$$('.coinsDisp').forEach(e=>e.textContent='🪙 '+p.coins);}
function earn(n,label,x,y){const p=P();if(!p)return;p.coins+=n;save();updateCoins();SFX.coin();floatText(`+${n} 🪙${label?' '+label:''}`,x,y);}
function tryBuy(key,price,name,done){
  const p=P();
  if(!price||p.owned.includes(key)){done();return;}
  if(p.coins<price){SFX.locked();toast(`You need ${price-p.coins} more 🪙 — play on the Fidget Shelf to earn some!`);return;}
  modal(`Get ${esc(name)}?`,`It costs 🪙 ${price}. You have 🪙 ${p.coins}.`,[{text:'Not now',cls:'ghost'},{text:'Yes, get it!',cls:'pink',on:()=>{p.coins-=price;p.owned.push(key);save();updateCoins();SFX.buy();toast(`Yay! You got ${name}! ✨`);done();}}]);
}
function buyConsumable(price,name,done){
  const p=P();
  if(p.coins<price){SFX.locked();toast(`You need ${price-p.coins} more 🪙 — play on the Fidget Shelf to earn some!`);return;}
  modal(`Buy ${esc(name)}?`,`It costs 🪙 ${price}. You have 🪙 ${p.coins}.`,[{text:'Not now',cls:'ghost'},{text:'Buy it!',cls:'pink',on:()=>{p.coins-=price;save();updateCoins();SFX.buy();done();}}]);

const roomSvg=$('#roomSvg');
let decorating=false,decoTab='mine',drag=null;
function mascotG(p){return `<g id="mascotG" class="mascot"><ellipse cx="500" cy="604" rx="62" ry="12" fill="#00000030"/>${mascotSVG(p.look,null,'x="420" y="396" width="160" height="216"')}</g>`;}
function renderRoom(){
  const p=P(); if(!p) return;
  const W=WALLS[p.room.wall]||WALLS.lavender, F=FLOORS[p.room.floor]||FLOORS.wood;
  let s=`<rect width="1000" height="470" fill="${W.fill}"/><rect width="1000" height="470" fill="url(#${W.pat})"/>`;
  s+=`<rect y="470" width="1000" height="230" fill="${F.fill}"/><rect y="470" width="1000" height="230" fill="url(#${F.pat})"/><rect y="458" width="1000" height="16" fill="#00000026"/>`;
  s+=furniture();
  const items=p.room.items.filter(i=>i.placed&&DECOR[i.type]);
  const deco=i=>`<g class="deco" data-uid="${i.uid}" transform="translate(${Math.round(i.x)} ${Math.round(i.y)})">${DECOR[i.type].d()}</g>`;
  s+=items.filter(i=>DECOR[i.type].flat).map(deco).join('');
  const list=items.filter(i=>!DECOR[i.type].flat).map(i=>({y:i.y,h:deco(i)}));
  list.push({y:604,h:mascotG(p)}); list.sort((a,b)=>a.y-b.y);
  s+=list.map(o=>o.h).join('');
  roomSvg.innerHTML=s;
  roomSvg.classList.toggle('decorating',decorating);
  $('#roomTitle').textContent=`${p.name}'s Room`;
  updateCoins();
}
function say(text){
  const old=$('#bubble'); if(old) old.remove();
  const w=Math.max(120,Math.round(text.length*11+40)), x=500-w/2;
  roomSvg.insertAdjacentHTML('beforeend',`<g id="bubble" style="pointer-events:none"><rect x="${x}" y="318" width="${w}" height="52" rx="26" fill="#fff" stroke="#2b2235" stroke-width="4"/><path d="M488 368 L500 392 L514 368" fill="#fff" stroke="#2b2235" stroke-width="4" stroke-linejoin="round"/><rect x="484" y="362" width="34" height="8" fill="#fff"/><text x="500" y="352" text-anchor="middle" font-size="22" font-weight="800" fill="#2b2235">${esc(text)}</text></g>`);
  clearTimeout(say.t); say.t=setTimeout(()=>{const b=$('#bubble');if(b)b.remove();},2600);
}
function mascotTap(){

function toSvg(e){const pt=roomSvg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(roomSvg.getScreenCTM().inverse());}
roomSvg.addEventListener('pointerdown',e=>{
  if(!decorating) return;
  const g=e.target.closest('.deco'); if(!g) return;
  const it=P().room.items.find(i=>i.uid===g.dataset.uid); if(!it) return;
  const pt=toSvg(e); drag={it,g,dx:it.x-pt.x,dy:it.y-pt.y};
  try{roomSvg.setPointerCapture(e.pointerId);}catch(_){}
  g.classList.add('dragging'); roomSvg.appendChild(g); SFX.click(); e.preventDefault();
});
roomSvg.addEventListener('pointermove',e=>{
  if(!drag) return;
  const pt=toSvg(e); drag.it.x=clamp(pt.x+drag.dx,30,970); drag.it.y=clamp(pt.y+drag.dy,90,700);
  drag.g.setAttribute('transform',`translate(${Math.round(drag.it.x)} ${Math.round(drag.it.y)})`);
  $('#decoPanel').classList.toggle('drop',e.clientY>$('#decoPanel').getBoundingClientRect().top);

  if(decoTab==='mine'){

    const keys=Object.keys(counts);
    h=keys.length?keys.map(k=>`<button class="tile" data-place="${k}"><div class="tv">${decoPrev(k)}</div><div class="tn">${DECOR[k].name}</div><div class="tp cnt">×${counts[k]}</div></button>`).join('')

  } else {

function spot(type){return DECOR[type].wall?{x:380+Math.random()*240,y:200+Math.random()*60}:{x:400+Math.random()*200,y:560+Math.random()*90};}
$('#decoGrid').addEventListener('click',e=>{
  const t=e.target.closest('.tile'); if(!t) return; const p=P();
  if(t.dataset.place){
    const it=p.room.items.find(i=>!i.placed&&i.type===t.dataset.place);
    if(it){Object.assign(it,spot(it.type),{placed:true});save();SFX.pop();renderRoom();renderDecoGrid();}
  } else if(t.dataset.buy){
    const k=t.dataset.buy, d=DECOR[k];
    buyConsumable(d.price,d.name,()=>{p.room.items.push(Object.assign({uid:uid(),type:k,placed:true},spot(k)));save();renderRoom();renderDecoGrid();toast(`${d.name} is in your room! Drag it anywhere ✨`);});
  } else if(t.dataset.surf){
    const isW=decoTab==='wall', k=t.dataset.surf, v=(isW?WALLS:FLOORS)[k];
    tryBuy((isW?'wall:':'floor:')+k,v.price,v.name,()=>{if(isW)p.room.wall=k;else p.room.floor=k;save();SFX.click();renderRoom();renderDecoGrid();});

});

function copyText(txt){
  const fallback=()=>{const ta=$('#bkCode');if(ta){ta.select();try{document.execCommand('copy');toast('Copied! 📋');}catch(e){toast('Select the code and copy it');}}};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>toast('Copied! 📋'),fallback); else fallback();

function downloadFile(txt){
  const name='hangout-room-backup-'+new Date().toISOString().slice(0,10)+'.json';
  // Inside the Android app, the wrapper opens a "save file" picker for us.
  if(window.AndroidBridge&&window.AndroidBridge.saveBackup){window.AndroidBridge.saveBackup(txt,name);return;}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast('Backup file saved 💾');}
  catch(e){toast('Saving files is not supported here — use Copy code');}
}
function restoreModal(){
  modal('♻️ Restore','Paste a backup code, or pick a backup file. This replaces ALL rooms on this device.<textarea class="inp" id="rsCode" placeholder="Paste backup code here" style="margin-top:10px"></textarea><input type="file" id="rsFile" accept=".json,application/json,text/plain" style="margin-top:10px;color:#fff">',
    [{text:'Cancel',cls:'ghost'},{text:'Restore',cls:'pink',keep:true,on:()=>doRestore($('#rsCode').value)}]);
  $('#rsFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#rsCode').value=r.result;};r.readAsText(f);};

function doRestore(txt){
  try{const d=JSON.parse(txt);if(!d||!Array.isArray(d.profiles))throw new Error('bad');
    fixDB(d);d.profiles.forEach(normalize);DB=d;save();closeModal();toast('Rooms restored! ✨');show('profiles');}
  catch(e){toast('Hmm, that backup code did not work.');}
}

/* ---------- pop-it ---------- */
const popState={down:new Array(36).fill(false),flipping:false};
const board=$('#popBoard');
let popping=false;
function renderPop(){
  const T=POP_THEMES[P().fid.pop]||POP_THEMES.rainbow;
  board.style.background=T.board;
  board.innerHTML=popState.down.map((d,i)=>`<div class="bub${d?' down':''}" data-i="${i}" style="background:${T.cols[Math.floor(i/6)]}"></div>`).join('');
}
function popAt(el){
  if(!el||!el.classList||!el.classList.contains('bub')||popState.flipping) return;
  const i=+el.dataset.i; if(popState.down[i]) return;
  popState.down[i]=true; el.classList.add('down'); SFX.pop(); vibrate(8);
  const p=P(); p.stats.pops++;
  if(p.stats.pops%10===0) earn(1); else saveSoon();
  if(popState.down.every(Boolean)){
    popState.flipping=true;
    setTimeout(()=>{
      board.classList.add('flip'); SFX.flip();
      setTimeout(()=>{popState.down.fill(false);renderPop();},320);
      setTimeout(()=>{board.classList.remove('flip');popState.flipping=false;p.stats.flips++;const r=board.getBoundingClientRect();earn(5,'Flip bonus!',r.left+r.width/2,r.top+r.height/2);},680);
    },250);
  }
}
board.addEventListener('pointerdown',e=>{popping=true;try{board.releasePointerCapture(e.pointerId);}catch(_){}popAt(e.target);});
document.addEventListener('pointermove',e=>{if(popping)popAt(document.elementFromPoint(e.clientX,e.clientY));});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{popping=false;}));

/* ---------- canvas helper ---------- */
function fit(cv){
  const r=cv.getBoundingClientRect(), d=Math.min(2,window.devicePixelRatio||1);
  const w=Math.max(1,Math.round(r.width*d)), h=Math.max(1,Math.round(r.height*d));
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
  const ctx=cv.getContext('2d'); ctx.setTransform(d,0,0,d,0,0);
  return {ctx,W:r.width,H:r.height};
}

/* ---------- squishy (slow-rise physics) ---------- */
const SQ={N:72,r:new Array(72).fill(1),s:0,press:false,px:0,py:0,downAt:0};
const sqc=$('#squishCv');
function sqPos(e){const r=sqc.getBoundingClientRect();SQ.px=e.clientX-r.left;SQ.py=e.clientY-r.top;}
sqc.addEventListener('pointerdown',e=>{sqPos(e);SQ.press=true;SQ.downAt=performance.now();try{sqc.setPointerCapture(e.pointerId);}catch(_){}SFX.squish();vibrate(15);});
sqc.addEventListener('pointermove',e=>{if(SQ.press)sqPos(e);});
function sqUp(){
  if(!SQ.press) return; SQ.press=false;
  if(performance.now()-SQ.downAt>90){SFX.unsquish();const p=P();p.stats.squish++;if(p.stats.squish%5===0)earn(1);else saveSoon();}
}
sqc.addEventListener('pointerup',sqUp); sqc.addEventListener('pointercancel',sqUp);

function drawSquish(dt){
  const {ctx,W,H}=fit(sqc); ctx.clearRect(0,0,W,H);
  const T=SQUISHIES[P().fid.squish]||SQUISHIES.mochi;
  const R=Math.min(W*0.3,H*0.28), cx=W/2, baseY=H*0.5+R*0.95;
  const k=x=>1-Math.pow(1-x,dt*60);
  SQ.s+=((SQ.press?0.3:0)-SQ.s)*k(SQ.press?0.2:0.025);
  const s=SQ.s, cy=baseY-R*(1-s);
  // table
  ctx.fillStyle='#3b2f52'; ctx.fillRect(0,baseY,W,H-baseY); ctx.fillStyle='#4b3a66'; ctx.fillRect(0,baseY,W,6);
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(cx,baseY+4,R*(1+s*.6),R*.12,0,0,TAU); ctx.fill();
  // blob outline points
  const pa=Math.atan2(SQ.py-cy,SQ.px-cx), pd=Math.hypot(SQ.px-cx,SQ.py-cy), N=SQ.N, pts=[];
  for(let i=0;i<N;i++){
    const a=i/N*TAU; let t=1;
    if(SQ.press&&pd>R*0.3){const da=Math.atan2(Math.sin(a-pa),Math.cos(a-pa));t=1-Math.exp(-da*da/0.16)*clamp((R*1.2-pd)/R,0,0.75)*0.5;}
    SQ.r[i]+=(t-SQ.r[i])*k(SQ.press?0.25:0.03);
    const b=T.extra==='cloud'?1+0.06*Math.cos(a*7):1, rr=R*SQ.r[i]*b;
    pts.push({x:cx+Math.cos(a)*rr*(1+s*.55),y:cy+Math.sin(a)*rr*(1-s)});
  }
  const at=a=>pts[Math.round((((a%TAU)+TAU)%TAU)/TAU*N)%N];
  ctx.lineWidth=3; ctx.strokeStyle=T.line; ctx.lineJoin='round';
  // things behind the body
  if(T.extra==='ears'){
    for(const sg of [-1,1]){const p=at(-Math.PI/2+sg*0.5),dx=p.x-cx,dy=p.y-cy,l=Math.hypot(dx,dy)||1;
      ctx.save();ctx.translate(p.x+dx/l*R*.28,p.y+dy/l*R*.28);ctx.rotate(Math.atan2(dy,dx)+Math.PI/2);
      ctx.fillStyle=T.fill;ctx.beginPath();ctx.ellipse(0,0,R*.2,R*.45,0,0,TAU);ctx.fill();ctx.stroke();
      ctx.fillStyle='#ffc1d9';ctx.beginPath();ctx.ellipse(0,R*.03,R*.09,R*.3,0,0,TAU);ctx.fill();ctx.restore();}
  }
  if(T.extra==='wings'){
    for(const sg of [1,-1]){const p=at(sg>0?0:Math.PI);ctx.save();ctx.translate(p.x-sg*R*.12,p.y);ctx.scale(sg,1);
      ctx.fillStyle='#6b46b8';ctx.beginPath();ctx.moveTo(0,-R*.25);ctx.quadraticCurveTo(R*.5,-R*.6,R*.78,-R*.2);ctx.quadraticCurveTo(R*.6,-R*.05,R*.64,R*.1);
      ctx.quadraticCurveTo(R*.47,0,R*.42,R*.18);ctx.quadraticCurveTo(R*.26,R*.05,0,R*.2);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
    for(const sg of [-1,1]){const p=at(-Math.PI/2+sg*0.45);ctx.fillStyle=T.fill;ctx.beginPath();ctx.moveTo(p.x-R*.14,p.y+R*.12);ctx.lineTo(p.x+sg*R*.06,p.y-R*.3);ctx.lineTo(p.x+R*.14,p.y+R*.12);ctx.closePath();ctx.fill();ctx.stroke();}
  }
  // body
  const g=ctx.createRadialGradient(cx-R*.35,cy-R*.45*(1-s),R*.08,cx,cy,R*1.5);
  g.addColorStop(0,T.hi); g.addColorStop(.4,T.fill); g.addColorStop(1,T.shade);
  ctx.beginPath(); const m0={x:(pts[N-1].x+pts[0].x)/2,y:(pts[N-1].y+pts[0].y)/2}; ctx.moveTo(m0.x,m0.y);
  for(let i=0;i<N;i++){const p=pts[i],q=pts[(i+1)%N];ctx.quadraticCurveTo(p.x,p.y,(p.x+q.x)/2,(p.y+q.y)/2);}
  ctx.closePath(); ctx.fillStyle=g; ctx.fill(); ctx.lineWidth=4; ctx.stroke();
  const sx=1+s*.55, sy=1-s;
  if(T.extra==='berry'){ctx.fillStyle='#ffe066';for(const [u,v] of [[-.5,-.2],[-.15,-.45],[.3,-.3],[.55,.05],[-.6,.25],[.1,.45],[-.25,.6],[.45,.5]]){ctx.beginPath();ctx.ellipse(cx+u*R*sx,cy+v*R*sy,R*.03,R*.05,0,0,TAU);ctx.fill();}}
  if(T.extra==='berry'||T.extra==='leaf'){const p=at(-Math.PI/2);ctx.fillStyle='#5cc28a';ctx.strokeStyle='#2b6a4a';ctx.lineWidth=3;
    const leaves=T.extra==='berry'?[-0.9,-0.3,0.3,0.9]:[0.5];
    for(const a of leaves){ctx.save();ctx.translate(p.x,p.y+R*.04);ctx.rotate(a);ctx.beginPath();ctx.ellipse(0,-R*.14,R*.08,R*.18,0,0,TAU);ctx.fill();ctx.stroke();ctx.restore();}}
  // face
  const fx=R*.3*sx, ey=cy+R*.02, ink=T.dark?'#fff':'#2a1f33';
  ctx.fillStyle=ink; ctx.strokeStyle=ink; ctx.lineCap='round';
  if(s>0.13){ctx.lineWidth=Math.max(2,R*.05);for(const sg of [-1,1]){const x=cx+sg*fx;ctx.beginPath();ctx.moveTo(x+sg*R*.06,ey-R*.08);ctx.lineTo(x-sg*R*.06,ey);ctx.lineTo(x+sg*R*.06,ey+R*.08);ctx.stroke();}}
  else for(const sg of [-1,1]){const x=cx+sg*fx;ctx.fillStyle=T.dark?'#ff4fa3':'#2a1f33';ctx.beginPath();ctx.ellipse(x,ey,R*.07,R*.09,0,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+R*.025,ey-R*.035,R*.028,0,TAU);ctx.fill();}
  ctx.fillStyle='rgba(255,130,180,.55)';for(const sg of [-1,1]){ctx.beginPath();ctx.ellipse(cx+sg*fx*1.4,ey+R*.14,R*.09,R*.05,0,0,TAU);ctx.fill();}
  ctx.strokeStyle=ink; ctx.lineWidth=Math.max(2,R*.03); const my=ey+R*.15;
  if(s>0.13){ctx.fillStyle=ink;ctx.beginPath();ctx.ellipse(cx,my+R*.02,R*.05,R*.06,0,0,TAU);ctx.fill();}
  else{ctx.beginPath();ctx.moveTo(cx-R*.08,my);ctx.quadraticCurveTo(cx-R*.04,my+R*.07,cx,my);ctx.quadraticCurveTo(cx+R*.04,my+R*.07,cx+R*.08,my);ctx.stroke();}
  if(T.extra==='wings'){ctx.fillStyle='#fff';for(const o of [-.05,.05]){ctx.beginPath();ctx.moveTo(cx+o*R-R*.02,my+R*.02);ctx.lineTo(cx+o*R,my+R*.08);ctx.lineTo(cx+o*R+R*.02,my+R*.02);ctx.fill();}}
}

/* ---------- spinner (flick physics) ---------- */
const SP={a:0,w:0,drag:false,last:0,lastT:0,wEst:0,acc:0};
const spc=$('#spinCv');
const angOf=e=>{const r=spc.getBoundingClientRect();return Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2);};
spc.addEventListener('pointerdown',e=>{SP.drag=true;SP.last=angOf(e);SP.lastT=performance.now();SP.wEst=0;SP.w=0;try{spc.setPointerCapture(e.pointerId);}catch(_){}});
spc.addEventListener('pointermove',e=>{
  if(!SP.drag) return; const a=angOf(e), now=performance.now();
  let d=a-SP.last; d=Math.atan2(Math.sin(d),Math.cos(d));
  const dt=Math.max(0.004,(now-SP.lastT)/1000);
  SP.a+=d; addRot(d); SP.wEst=SP.wEst*0.5+(d/dt)*0.5; SP.last=a; SP.lastT=now;
});
function spUp(){if(!SP.drag)return;SP.drag=false;SP.w=(performance.now()-SP.lastT>100)?0:clamp(SP.wEst*1.15,-90,90);}
spc.addEventListener('pointerup',spUp); spc.addEventListener('pointercancel',spUp);
function addRot(d){
  SP.acc+=Math.abs(d);
  while(SP.acc>=TAU){SP.acc-=TAU;const p=P();p.stats.spins++;if(p.stats.spins%25===0){const r=spc.getBoundingClientRect();earn(1,null,r.left+r.width/2,r.top+r.height*0.2);}}
}
function cStar(ctx,x,y,r){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();ctx.fill();}
function cHeart(ctx,x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.9);ctx.bezierCurveTo(x-s*1.6,y-s*.1,x-s*.9,y-s*1.3,x,y-s*.45);ctx.bezierCurveTo(x+s*.9,y-s*1.3,x+s*1.6,y-s*.1,x,y+s*.9);ctx.fill();}
function spinnerShape(ctx,cx,cy,R,a,T){
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(a);
  const L=R*.62, lr=R*.36, lobes=[0,1,2].map(k=>{const t=k*TAU/3;return [Math.cos(t)*L,Math.sin(t)*L];});
  // outline pass, then fill pass, so lobes + middle read as one smooth shape
  ctx.fillStyle=T.edge; ctx.beginPath(); ctx.arc(0,0,R*.47+5,0,TAU); ctx.fill();
  lobes.forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,lr+5,0,TAU);ctx.fill();});
  ctx.fillStyle=T.body; ctx.beginPath(); ctx.arc(0,0,R*.47,0,TAU); ctx.fill();
  lobes.forEach(([x,y])=>{
    ctx.fillStyle=T.body;ctx.beginPath();ctx.arc(x,y,lr,0,TAU);ctx.fill();
    const g=ctx.createRadialGradient(x-lr*.2,y-lr*.2,lr*.05,x,y,lr*.65);g.addColorStop(0,'#fff');g.addColorStop(1,'#9a96a8');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,lr*.62,0,TAU);ctx.fill();ctx.fillStyle='#55505f';ctx.beginPath();ctx.arc(x,y,lr*.36,0,TAU);ctx.fill();
  });
  ctx.fillStyle=T.deco==='pent'?'#222':T.edge;
  for(let k=0;k<3;k++){const t=k*TAU/3+Math.PI/3,x=Math.cos(t)*R*.35,y=Math.sin(t)*R*.35;
    if(T.deco==='star')cStar(ctx,x,y,R*.08);else if(T.deco==='heart')cHeart(ctx,x,y,R*.06);else{ctx.beginPath();for(let i=0;i<5;i++){const q=i*TAU/5-Math.PI/2;ctx.lineTo(x+Math.cos(q)*R*.06,y+Math.sin(q)*R*.06);}ctx.closePath();ctx.fill();}}
  ctx.fillStyle=T.cap;ctx.strokeStyle=T.edge;ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,R*.24,0,TAU);ctx.fill();ctx.stroke();
  ctx.fillStyle=T.body;ctx.beginPath();ctx.arc(0,0,R*.11,0,TAU);ctx.fill();
  ctx.restore();
}
function drawSpin(dt){
  const {ctx,W,H}=fit(spc); ctx.clearRect(0,0,W,H);
  const p=P(), T=SPINS[p.fid.spin]||SPINS.galaxy;
  if(!SP.drag){const d=SP.w*dt;SP.a+=d;addRot(d);SP.w*=Math.exp(-0.22*dt);if(Math.abs(SP.w)<1)SP.w*=Math.exp(-2*dt);if(Math.abs(SP.w)<0.03)SP.w=0;}
  const R=Math.min(W,H)*0.34, speed=Math.abs(SP.drag?SP.wEst:SP.w);
  const ghosts=speed>12?3:0, dir=Math.sign(SP.drag?SP.wEst:SP.w)||1;
  for(let i=ghosts;i>=0;i--){ctx.globalAlpha=i?0.13:1;spinnerShape(ctx,W/2,H/2,R,SP.a-i*dir*0.13,T);}
  ctx.globalAlpha=1;
  const rpm=Math.round(speed*60/TAU);
  if(rpm>p.stats.bestRpm){p.stats.bestRpm=rpm;saveSoon();}
  $('#rpm').textContent=`🌀 ${rpm} RPM · Best ${p.stats.bestRpm}`;
  hum(speed);
}

/* =========================================================
   11. MAIN LOOP + STARTUP
   ========================================================= */
function loop(t){
  const dt=Math.min(0.05,(t-(loop.last||t))/1000); loop.last=t;
  if(cur==='fidget'&&P()){
    if(fidTab==='squish') drawSquish(dt);
    if(fidTab==='spin') drawSpin(dt); else if(humG&&AC) humG.gain.setTargetAtTime(0,AC.currentTime,0.05);
  } else if(humG&&AC) humG.gain.setTargetAtTime(0,AC.currentTime,0.05);
  requestAnimationFrame(loop);
}
document.addEventListener('pointerdown',e=>{lastX=e.clientX;lastY=e.clientY;ac();if(DB.settings.music)startMusic();},true);
document.addEventListener('contextmenu',e=>e.preventDefault());
// Android back button (called by the APK wrapper). Returns true if the app handled it.
window.androidBack=function(){
  if(!$('#modal').classList.contains('hidden')){closeModal();return true;}
  if(decorating){exitDecorate();return true;}
  if(cur==='fidget'||cur==='closet'){show('room');return true;}
  if(cur==='room'){show('profiles');return true;}
  return false;
};
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();if(AC)AC.suspend();}else if(AC)AC.resume();});

buildDefs();
show('profiles');
requestAnimationFrame(loop);
</script>
